---
version: 5

defaults:
  datadir: "data"

hierarchy:
  - name: "YAML backend"
    data_hash: yaml_data
    paths:
      - "nodes/%{trusted.certname}.yaml"
      - "common.yaml"
  - name: 'compliance'
    data_hash: yaml_data
    paths:
      - "compliance/%{facts.os.name}/%{facts.os.release.major}.yaml"
      - "compliance/common.yaml"
